# LLM Models Configuration
default_model: "glm-isoquant"
default_provider: "openai_compatible"
mock_mode: false # Set true for offline unit testing without API keys

opik_enabled: false # Set true for Opik observability tracing
max_retries: 3 # Global retry limit for transient network/rate-limit errors

# Fiscal Budget and Spending Caps
budget_usd: 4.00 # Total authorized credit in USD
reserve_usd: 0.40 # Safety reserve in USD
hard_cap_usd: 3.60 # Hard spend ceiling in USD (4.00 credit minus reserve)

# Multi-family Model Registry
models:
  - name: "glm-isoquant"
    provider: "openai_compatible"
    model_id: "glm-5.3-flash"
    base_url: "https://api.isoquant.ai/v1"
    api_key_env: "ISOQUANT_API_KEY"
    temperature: 0.2
    max_tokens: 256
    timeout_s: 60.0
    price_per_1k_input: 0.000027 # confirmed rate ($0.027 / 1M tokens)
    price_per_1k_cached_input: 0.000018 # confirmed rate ($0.018 / 1M tokens)
    price_per_1k_output: 0.00049 # confirmed rate ($0.49 / 1M tokens)
    reasoning_tokens: "disabled" # optional setting to disable/limit reasoning tokens
    supports_json_schema: true
    enabled: true
    max_concurrency: 10
    requests_per_minute: 60

  - name: "openai-main"
    provider: "openai_compatible"
    model_id: "TODO_FILL_FROM_PROVIDER_DOCS"
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    temperature: 0.2
    max_tokens: 2048
    timeout_s: 60.0
    price_per_1k_input: "TODO_FILL_FROM_PROVIDER_DOCS"
    price_per_1k_output: "TODO_FILL_FROM_PROVIDER_DOCS"
    supports_json_schema: true
    enabled: false
    max_concurrency: 10
    requests_per_minute: 60

  - name: "grok-main"
    provider: "openai_compatible"
    model_id: "TODO_FILL_FROM_PROVIDER_DOCS"
    base_url: "https://api.x.ai/v1"
    api_key_env: "XAI_API_KEY"
    temperature: 0.2
    max_tokens: 2048
    timeout_s: 60.0
    price_per_1k_input: "TODO_FILL_FROM_PROVIDER_DOCS"
    price_per_1k_output: "TODO_FILL_FROM_PROVIDER_DOCS"
    supports_json_schema: true
    enabled: false
    max_concurrency: 10
    requests_per_minute: 60

  - name: "gemini-main"
    provider: "gemini"
    model_id: "TODO_FILL_FROM_PROVIDER_DOCS"
    api_key_env: "GOOGLE_API_KEY"
    temperature: 0.2
    max_tokens: 2048
    timeout_s: 60.0
    price_per_1k_input: "TODO_FILL_FROM_PROVIDER_DOCS"
    price_per_1k_output: "TODO_FILL_FROM_PROVIDER_DOCS"
    supports_json_schema: true
    enabled: false
    max_concurrency: 10
    requests_per_minute: 60

  - name: "mock"
    provider: "mock"
    model_id: "mock-model"
    api_key_env: "MOCK_API_KEY"
    temperature: 0.0
    max_tokens: 2048
    timeout_s: 10.0
    price_per_1k_input: 0.0
    price_per_1k_output: 0.0
    supports_json_schema: true
    enabled: true
    max_concurrency: 100
    requests_per_minute: 1000

# Agent Role Allocations
agents:
  supervisor:
    provider: "openai_compatible"
    model: "glm-isoquant"
    temperature: 0.1
    max_tokens: 256
  inventory_agent:
    provider: "openai_compatible"
    model: "glm-isoquant"
    temperature: 0.2
    max_tokens: 256
  sourcing_agent:
    provider: "openai_compatible"
    model: "glm-isoquant"
    temperature: 0.2
    max_tokens: 256
  logistics_agent:
    provider: "openai_compatible"
    model: "glm-isoquant"
    temperature: 0.2
    max_tokens: 256
