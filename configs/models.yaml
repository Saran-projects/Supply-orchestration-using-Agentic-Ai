# LLM Models Configuration
default_model: "glm-isoquant"
default_provider: "openai_compatible"
mock_mode: false # Set true for offline unit testing without API keys

opik_enabled: false # Set true for Opik observability tracing
cache_dir: ".cache/llm" # Local disk cache directory
max_retries: 3 # Global retry limit for transient network/rate-limit errors

# Multi-family Model Registry
models:
  - name: "glm-isoquant"
    provider: "openai_compatible"
    model_id: "glm-5.3-flash"
    base_url: "https://api.isoquant.ai/v1"
    api_key_env: "ISOQUANT_API_KEY"
    temperature: 0.2
    max_tokens: 4096
    timeout_s: 60.0
    price_per_1k_input: 0.000154 # 2.2x conservative placeholder
    price_per_1k_output: 0.00044 # 2.2x conservative placeholder
    supports_json_schema: true
    enabled: true
    max_concurrency: 10
    requests_per_minute: 60

  - name: "openai-main"
    provider: "openai_compatible"
    model_id: "TODO_FILL_FROM_PROVIDER_DOCS"
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    temperature: 0.2
    max_tokens: 2048
    timeout_s: 60.0
    price_per_1k_input: "TODO_FILL_FROM_PROVIDER_DOCS"
    price_per_1k_output: "TODO_FILL_FROM_PROVIDER_DOCS"
    supports_json_schema: true
    enabled: false
    max_concurrency: 10
    requests_per_minute: 60

  - name: "grok-main"
    provider: "openai_compatible"
    model_id: "TODO_FILL_FROM_PROVIDER_DOCS"
    base_url: "https://api.x.ai/v1"
    api_key_env: "XAI_API_KEY"
    temperature: 0.2
    max_tokens: 2048
    timeout_s: 60.0
    price_per_1k_input: "TODO_FILL_FROM_PROVIDER_DOCS"
    price_per_1k_output: "TODO_FILL_FROM_PROVIDER_DOCS"
    supports_json_schema: true
    enabled: false
    max_concurrency: 10
    requests_per_minute: 60

  - name: "gemini-main"
    provider: "gemini"
    model_id: "TODO_FILL_FROM_PROVIDER_DOCS"
    api_key_env: "GOOGLE_API_KEY"
    temperature: 0.2
    max_tokens: 2048
    timeout_s: 60.0
    price_per_1k_input: "TODO_FILL_FROM_PROVIDER_DOCS"
    price_per_1k_output: "TODO_FILL_FROM_PROVIDER_DOCS"
    supports_json_schema: true
    enabled: false
    max_concurrency: 10
    requests_per_minute: 60

  - name: "mock"
    provider: "mock"
    model_id: "mock-model"
    api_key_env: "MOCK_API_KEY"
    temperature: 0.0
    max_tokens: 2048
    timeout_s: 10.0
    price_per_1k_input: 0.0
    price_per_1k_output: 0.0
    supports_json_schema: true
    enabled: true
    max_concurrency: 100
    requests_per_minute: 1000

# Agent Role Allocations
agents:
  supervisor:
    provider: "openai_compatible"
    model: "glm-isoquant"
    temperature: 0.1
    max_tokens: 2048
  inventory_agent:
    provider: "openai_compatible"
    model: "glm-isoquant"
    temperature: 0.2
    max_tokens: 1536
  sourcing_agent:
    provider: "openai_compatible"
    model: "glm-isoquant"
    temperature: 0.2
    max_tokens: 1536
  logistics_agent:
    provider: "openai_compatible"
    model: "glm-isoquant"
    temperature: 0.2
    max_tokens: 1536
